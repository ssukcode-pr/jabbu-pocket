name: ci

# CI runs on every PR and every main push (no path filter: a required check must always report, or a
# docs-only PR would wait forever for it). test/ci-workflow.test.ts pins the hardening below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every main push keeps its own run (its result is the record for that commit); a new PR push
# replaces the PR's previous run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The release leak scanner tests run the real gitleaks; without it they skip.
      - name: Install gitleaks 8.28.0
        run: |
          bash scripts/ci-install-gitleaks.sh "$RUNNER_TEMP/bin"
          echo "JABBU_GITLEAKS=$RUNNER_TEMP/bin/gitleaks" >> "$GITHUB_ENV"
      - run: bun run check
      - run: bun run knip
      - run: bun test --parallel=3
      # Mailbox TLA+ model (spec/tla/mailbox): --strict fails instead of skipping when Java is missing. Only the
      # pinned tla2tools.jar is cached; the script checks its sha256 either way.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/jabbu-pocket/tla2tools-v1.7.4.jar
          key: tla2tools-v1.7.4-936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      - name: TLA+ mailbox model
        run: bun scripts/tla-check.ts --strict

  # The test job's steps without the TLA+ model check, on the arm64 image the daemon runs on (OCI aarch64).
  # Not a required check.
  test-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The release leak scanner tests run the real gitleaks; without it they skip.
      - name: Install gitleaks 8.28.0
        run: |
          bash scripts/ci-install-gitleaks.sh "$RUNNER_TEMP/bin"
          echo "JABBU_GITLEAKS=$RUNNER_TEMP/bin/gitleaks" >> "$GITHUB_ENV"
      - run: bun run check
      - run: bun run knip
      - run: bun test --parallel=3

  # Real `omp --mode rpc` answered by the scripted mock model: an omp release that breaks the RPC
  # contract fails here. The prerequisite check fails the job instead of letting the e2e skip.
  e2e-omp-mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install gitleaks 8.28.0
        run: |
          bash scripts/ci-install-gitleaks.sh "$RUNNER_TEMP/bin"
          echo "JABBU_GITLEAKS=$RUNNER_TEMP/bin/gitleaks" >> "$GITHUB_ENV"
      - name: Install pinned omp test host
        run: |
          cd test/fixtures/omp-host && bun install --frozen-lockfile
          echo "JABBU_OMP_EXECUTABLE=$GITHUB_WORKSPACE/test/fixtures/omp-host/node_modules/.bin/omp" >> "$GITHUB_ENV"
      - name: Check test fixtures
        run: bun src/dev/check-test-fixtures.ts
      - name: omp mock e2e
        env:
          JABBU_E2E_OMP_MOCK: "1"
        run: bun test test/omp-mock.e2e.test.ts test/omp-rpc.contract.test.ts
